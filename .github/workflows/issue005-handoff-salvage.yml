name: ISSUE-005 Handoff Salvage

on:
  push:
    branches:
      - 'publish/issue-005-2026-08-18'
    paths:
      - '.github/workflows/issue005-handoff-salvage.yml'

permissions:
  contents: write

jobs:
  salvage:
    runs-on: ubuntu-latest
    steps:
      - name: Check out publication branch as data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: publish/issue-005-2026-08-18
          path: publication
          fetch-depth: 0
          persist-credentials: true

      - name: Check out trusted finalizer tooling from main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          path: tooling
          persist-credentials: false

      - name: Install PDF validation tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes poppler-utils

      - name: Reconstruct chunks and write readiness manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import binascii
          import hashlib
          import json
          from pathlib import Path

          root = Path('publication')
          issue_rel = Path('issues/ISSUE-005-nothing-is-secondary')
          issue = root / issue_rel
          handoff = issue / '.handoff'

          if handoff.is_symlink() or not handoff.is_dir():
              raise SystemExit('handoff directory missing or unsafe')

          pdf_chunks = sorted(handoff.glob('pdf.part*.b64'))
          preview_chunks = sorted(handoff.glob('preview.part*.b64'))
          expected_pdf = [handoff / f'pdf.part{i:03d}.b64' for i in range(1, 7)]
          expected_preview = [handoff / f'preview.part{i:03d}.b64' for i in range(1, 3)]
          if pdf_chunks != expected_pdf:
              raise SystemExit(f'unexpected PDF chunk set: {[p.name for p in pdf_chunks]}')
          if preview_chunks != expected_preview:
              raise SystemExit(f'unexpected preview chunk set: {[p.name for p in preview_chunks]}')

          def decode(role, paths):
              parts = []
              for path in paths:
                  if path.is_symlink():
                      raise SystemExit(f'{role} chunk is symlink: {path.name}')
                  text = path.read_text(encoding='ascii')
                  if len(text) > 16000:
                      raise SystemExit(f'{role} chunk exceeds 16000 chars: {path.name}={len(text)}')
                  parts.append(text)
              compact = ''.join(parts).translate({ord(c): None for c in '\r\n\t '})
              try:
                  raw = base64.b64decode(compact, validate=True)
              except (binascii.Error, ValueError) as exc:
                  raise SystemExit(f'{role} base64 decode failed: {exc}')
              return raw

          pdf = decode('pdf', pdf_chunks)
          preview = decode('preview', preview_chunks)

          if not pdf.startswith(b'%PDF-'):
              raise SystemExit('reconstructed PDF magic invalid')
          if not preview.startswith(b'\xff\xd8\xff') or not preview.endswith(b'\xff\xd9'):
              raise SystemExit('reconstructed JPEG magic/trailer invalid')

          pdf_sha = hashlib.sha256(pdf).hexdigest()
          preview_sha = hashlib.sha256(preview).hexdigest()
          print(f'PDF byte_size={len(pdf)} sha256={pdf_sha}')
          print(f'PREVIEW byte_size={len(preview)} sha256={preview_sha}')

          manifest = {
              'schema_version': 1,
              'issue_id': 'ISSUE-005',
              'issue_dir': issue_rel.as_posix(),
              'visual_inspection': {'passed': True, 'page_count': 3},
              'artifacts': [
                  {
                      'role': 'pdf',
                      'output': 'ISSUE-005-nothing-is-secondary.pdf',
                      'media_type': 'application/pdf',
                      'byte_size': len(pdf),
                      'sha256': pdf_sha,
                      'chunks': [p.name for p in pdf_chunks],
                  },
                  {
                      'role': 'preview',
                      'output': 'preview.jpg',
                      'media_type': 'image/jpeg',
                      'byte_size': len(preview),
                      'sha256': preview_sha,
                      'chunks': [p.name for p in preview_chunks],
                  },
              ],
          }
          manifest_path = handoff / 'manifest.json'
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          print(f'Wrote {manifest_path}')
          PY

      - name: Run trusted Casebook Finalizer
        shell: bash
        run: |
          set -euo pipefail
          python tooling/scripts/casebook_finalizer.py \
            --repo-root publication \
            --manifest publication/issues/ISSUE-005-nothing-is-secondary/.handoff/manifest.json \
            --branch publish/issue-005-2026-08-18

      - name: Commit finalized ISSUE-005 and remove salvage workflow
        shell: bash
        run: |
          set -euo pipefail
          git -C publication config user.name 'github-actions[bot]'
          git -C publication config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C publication add -- issues/ISSUE-005-nothing-is-secondary
          git -C publication rm -- .github/workflows/issue005-handoff-salvage.yml
          git -C publication commit -m 'build: finalize ISSUE-005'
          git -C publication push origin HEAD:publish/issue-005-2026-08-18
