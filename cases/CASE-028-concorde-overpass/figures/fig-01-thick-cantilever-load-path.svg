<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img"><title>de la Concorde thick cantilever load-path schematic</title><desc>Conceptual discontinuity-region schematic derived from SRC-0036 and SRC-0037. It traces a bearing reaction through a thick cantilever support into the abutment without asserting as-built reinforcement dimensions.</desc><rect width="1000" height="520" fill="#f7f3ea"/><g stroke="#172433" stroke-width="5" fill="none"><path d="M90 395H425V145H575V395H910"/><rect x="430" y="220" width="140" height="42" fill="#d8b36a"/><path d="M570 241H860"/><path d="M470 220L355 355" stroke="#9b3f32" stroke-width="12"/><path d="M485 205L300 205L220 310" stroke="#285a6a" stroke-width="8"/></g><g fill="#172433" font-family="Arial,sans-serif"><text x="80" y="445" font-size="25">abutment / thick cantilever support</text><text x="610" y="215" font-size="24">central span</text><text x="431" y="207" font-size="22">bearing seat</text><text x="335" y="382" font-size="21">diagonal compression path</text><text x="155" y="185" font-size="21">tie / anchorage zone to verify</text><text x="70" y="65" font-size="28" font-weight="700">TRACE THE REACTION THROUGH THE DISCONTINUITY REGION</text><text x="70" y="100" font-size="20">Conceptual only; not an as-built reinforcement drawing.</text></g><g stroke="#9b3f32" stroke-width="5" fill="#9b3f32"><line x1="500" y1="120" x2="500" y2="205"/><path d="M488 187L500 210L512 187Z"/></g><text x="520" y="150" font-family="Arial,sans-serif" font-size="22" fill="#9b3f32">bearing reaction</text><!-- Origin: Engineering Casebook redraw. Sources: SRC-0036, SRC-0037 --></svg>