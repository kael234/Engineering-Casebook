<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img"><title>Penobscot Narrows stay-cable decay before and after viscous dampers</title><desc>Schematic redraw of the documented Cable 19A decay comparison in FHWA SRC-0040. Similar acceleration decay required roughly 200 seconds before damper installation and roughly 25 seconds after.</desc><rect width="1000" height="520" fill="#f7f3ea"/><g stroke="#172433" stroke-width="4"><line x1="110" y1="410" x2="920" y2="410"/><line x1="110" y1="410" x2="110" y2="95"/></g><path d="M110 120C180 150 230 170 285 190C400 235 525 275 650 310C760 342 850 365 910 382" fill="none" stroke="#9b3f32" stroke-width="7"/><path d="M110 120C145 195 165 260 185 320C205 360 220 375 235 382C360 390 650 392 910 394" fill="none" stroke="#2d6f8a" stroke-width="7"/><g font-family="Arial,sans-serif" fill="#172433"><text x="70" y="55" font-size="28" font-weight="700">FULL-SCALE TEST: DID THE DAMPER CHANGE DAMPING?</text><text x="120" y="455" font-size="18">0 s</text><text x="875" y="455" font-size="18">200 s</text><text x="25" y="120" font-size="18">~0.2 g</text><text x="25" y="385" font-size="18">~0.02 g</text><text x="570" y="255" font-size="20" fill="#9b3f32">before damper: ~200 s decay</text><text x="250" y="335" font-size="20" fill="#2d6f8a">after damper: ~25 s decay</text><text x="115" y="495" font-size="18">Schematic redraw of FHWA Figure 55; not a digitized test trace.</text></g><!-- Origin: Engineering Casebook redraw. Source: SRC-0040 --></svg>