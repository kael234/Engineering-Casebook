<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" role="img"><title>Ronan Point local bearing-wall loss and progressive collapse</title><desc>Sequence showing a local explosion removing an exterior bearing wall at the 18th floor, loss of support to upper floors, then debris impact initiating downward progressive collapse.</desc><metadata>origin: Engineering Casebook redraw; source_ids: [SRC-0031, SRC-0032]</metadata><defs><marker id="r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#963f30"/></marker></defs><rect width="820" height="430" fill="#eaf2f5"/><g font-family="Inter" fill="#19384a"><text x="65" y="38" font-size="21">1. Bearing wall present</text><text x="315" y="38" font-size="21">2. Local wall loss</text><text x="575" y="38" font-size="21">3. No alternate path</text></g><g stroke="#19384a" stroke-width="3" fill="#f7f3eb"><rect x="80" y="70" width="150" height="260"/><rect x="335" y="70" width="150" height="260"/><rect x="590" y="70" width="150" height="260"/></g><g stroke="#19384a" stroke-width="2"><line x1="80" y1="135" x2="230" y2="135"/><line x1="80" y1="200" x2="230" y2="200"/><line x1="80" y1="265" x2="230" y2="265"/><line x1="335" y1="135" x2="485" y2="135"/><line x1="335" y1="200" x2="485" y2="200"/><line x1="335" y1="265" x2="485" y2="265"/><line x1="590" y1="135" x2="740" y2="135"/><line x1="590" y1="200" x2="740" y2="200"/><line x1="590" y1="265" x2="740" y2="265"/></g><g fill="#19384a"><rect x="95" y="205" width="18" height="60"/><rect x="198" y="205" width="18" height="60"/><rect x="350" y="205" width="18" height="60"/></g><circle cx="450" cy="232" r="30" fill="#f2c66f" stroke="#963f30" stroke-width="4"/><path d="M430 215 l40 35 M470 215 l-40 35" stroke="#963f30" stroke-width="5"/><path d="M620 95 L705 175 L640 205 L720 290" fill="none" stroke="#963f30" stroke-width="8" marker-end="url(#r)"/><text x="325" y="365" font-family="Inter" font-size="18" fill="#243947">18th-floor exterior bearing wall removed</text><text x="545" y="390" font-family="Inter" font-size="18" fill="#243947">upper floors fall; impact then drives collapse downward</text></svg>