<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img"><title>Po Shan drainage-tunnel groundwater regulation system</title><desc>Conceptual hillside section based on CEDD SRC-0041 showing two drainage tunnels, distributed sub-vertical drains, groundwater interception, outlet routing and real-time monitoring. Documented system quantities are 3.5 m tunnel diameter, 500 m total tunnel length and 172 sub-vertical drains.</desc><rect width="1000" height="560" fill="#f7f3ea"/><path d="M80 410C250 300 390 155 560 125C715 100 835 185 940 245V495H80Z" fill="#d8c7a4" stroke="#172433" stroke-width="4"/><path d="M200 325C360 270 555 245 825 300" fill="none" stroke="#2d6f8a" stroke-width="7" stroke-dasharray="14 10"/><circle cx="455" cy="390" r="52" fill="#eef0ec" stroke="#172433" stroke-width="5"/><circle cx="640" cy="405" r="52" fill="#eef0ec" stroke="#172433" stroke-width="5"/><g stroke="#285a6a" stroke-width="5"><line x1="350" y1="170" x2="440" y2="345"/><line x1="440" y1="145" x2="470" y2="340"/><line x1="540" y1="135" x2="610" y2="355"/><line x1="650" y1="145" x2="650" y2="350"/><line x1="750" y1="180" x2="675" y2="360"/></g><g stroke="#2d6f8a" stroke-width="6" fill="none"><path d="M405 390H250V470H80"/><path d="M690 405H780V470H920"/></g><g font-family="Arial,sans-serif" fill="#172433"><text x="55" y="55" font-size="28" font-weight="700">INTERCEPT → COLLECT → OUTLET → MONITOR</text><text x="310" y="235" font-size="19">distributed sub-vertical drains</text><text x="330" y="458" font-size="19">pair of 3.5 m drainage tunnels</text><text x="700" y="335" font-size="19">172 drains in documented system</text><text x="695" y="505" font-size="19">total tunnel length: 500 m</text><text x="80" y="535" font-size="18">Automatic real-time groundwater monitoring closes the operational loop. Conceptual, not to scale.</text></g><!-- Origin: Engineering Casebook redraw. Source: SRC-0041 --></svg>