<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img"><title>Greater New Orleans HSDRRS integrated line of defense</title><desc>Schematic system map showing surge barriers, perimeter levees and floodwalls, gates, pumps and armoring acting together. Official USACE figures note nearly 133 miles improved and about 68 miles of interior defenses removed from direct surge exposure.</desc><metadata>origin: Engineering Casebook schematic; source_ids: [SRC-0033]</metadata><rect width="900" height="470" fill="#eaf2f5"/><path d="M80 350 C180 240 210 130 350 105 C500 80 675 135 790 250 C750 360 610 400 430 405 C270 410 150 390 80 350 Z" fill="#f7f3eb" stroke="#19384a" stroke-width="5"/><path d="M55 365 C165 230 195 105 345 75 C525 45 725 115 830 245" fill="none" stroke="#c85f3b" stroke-width="16"/><path d="M715 135 L805 205" stroke="#19384a" stroke-width="18"/><rect x="735" y="155" width="45" height="80" fill="#f2c66f" stroke="#19384a" stroke-width="4"/><g fill="#3a82a8"><circle cx="210" cy="315" r="23"/><circle cx="320" cy="365" r="23"/><circle cx="650" cy="330" r="23"/></g><g font-family="Inter" fill="#243947"><text x="585" y="95" font-size="21">surge barrier / gate complexes</text><text x="115" y="215" font-size="21">perimeter levees + floodwalls</text><text x="145" y="425" font-size="20">gates and pump stations close / evacuate water</text><text x="520" y="430" font-size="20">armoring adds overtopping resilience</text><text x="95" y="52" font-size="24" fill="#19384a">Integrated risk-reduction system, not isolated levee segments</text><text x="105" y="105" font-size="22" fill="#c85f3b">~133 miles improved</text><text x="520" y="270" font-size="22" fill="#c85f3b">~68 miles of interior defenses removed from direct surge exposure</text></g></svg>