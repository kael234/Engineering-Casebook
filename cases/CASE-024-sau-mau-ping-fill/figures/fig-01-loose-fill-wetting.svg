<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" role="img"><title>Sau Mau Ping loose fill wetting mechanism and remedial concept</title><desc>Left: loose end-tipped fill develops a wetted zone and loses strength during rainfall. Right: review panel remedial concept with at least 3 m recompacted surface layer, 1 on 1.5 slope and drainage.</desc><metadata>origin: Engineering Casebook redraw; source_ids: [SRC-0030]</metadata><defs><marker id="w" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#3a82a8"/></marker><marker id="r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#963f30"/></marker></defs><rect width="820" height="440" fill="#eaf2f5"/><text x="70" y="45" font-family="Inter" font-size="24" fill="#19384a">Loose end-tipped fill</text><path d="M45 345 L95 95 L365 345 Z" fill="#d9c7a6" stroke="#19384a" stroke-width="4"/><path d="M90 145 C155 185 205 245 260 330 L135 330 Z" fill="#8fc3d8" fill-opacity="0.75"/><g stroke="#3a82a8" stroke-width="5" marker-end="url(#w)"><line x1="120" y1="60" x2="120" y2="125"/><line x1="185" y1="70" x2="180" y2="155"/><line x1="250" y1="85" x2="235" y2="190"/></g><path d="M145 220 C215 260 255 300 325 340" fill="none" stroke="#963f30" stroke-width="7" marker-end="url(#r)"/><text x="80" y="385" font-family="Inter" font-size="18" fill="#6d7b82">Wetting + seepage -> loss of strength -> rapid flow</text><line x1="410" y1="55" x2="410" y2="395" stroke="#a8bec9" stroke-width="2"/><text x="485" y="45" font-family="Inter" font-size="24" fill="#19384a">Panel remedial concept</text><path d="M455 345 L520 120 L760 345 Z" fill="#d9c7a6" stroke="#19384a" stroke-width="4"/><path d="M455 345 L520 120 L548 145 L490 345 Z" fill="#5d7f6b" fill-opacity="0.75"/><path d="M520 118 L535 80 L550 118" fill="none" stroke="#3a82a8" stroke-width="6"/><line x1="535" y1="80" x2="690" y2="80" stroke="#3a82a8" stroke-width="6" marker-end="url(#w)"/><text x="560" y="155" font-family="Inter" font-size="18" fill="#243947">recompacted surface layer</text><text x="560" y="180" font-family="Inter" font-size="18" fill="#243947">minimum 3 m</text><text x="555" y="295" font-family="Inter" font-size="18" fill="#243947">1 vertical : 1.5 horizontal</text><text x="555" y="385" font-family="Inter" font-size="18" fill="#6d7b82">plus drainage, surface protection and leaking-service safeguards</text></svg>