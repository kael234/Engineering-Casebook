<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" role="img"><title>Skyline Plaza construction age stack</title><desc>Schematic showing the 21st through 24th floors and their pour dates at the time of the March 2, 1973 collapse. The 23rd floor was only three to seven days old depending on pour section.</desc><metadata>origin: Engineering Casebook redraw; source_ids: [SRC-0029]</metadata><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#963f30"/></marker></defs><rect width="820" height="430" fill="#eaf2f5"/><g stroke="#19384a" stroke-width="4" fill="#f7f3eb"><rect x="110" y="65" width="560" height="52"/><rect x="110" y="135" width="560" height="52"/><rect x="110" y="205" width="560" height="52"/><rect x="110" y="275" width="560" height="52"/></g><g font-family="Inter" fill="#243947"><text x="30" y="98" font-size="24">21st</text><text x="30" y="168" font-size="24">22nd</text><text x="30" y="238" font-size="24">23rd</text><text x="30" y="308" font-size="24">24th</text><text x="130" y="98" font-size="20">Feb 5, 6, 7, 13</text><text x="130" y="168" font-size="20">Feb 14, 15, 20, 21</text><text x="130" y="238" font-size="20">Feb 23, 24, 26, 27</text><text x="130" y="308" font-size="20">Feb 28, Mar 1, Mar 2</text><text x="485" y="168" font-size="18">9-16 days old</text><text x="485" y="238" font-size="18" fill="#963f30">3-7 days old</text><text x="485" y="308" font-size="18">0-2 days old</text></g><line x1="705" y1="300" x2="705" y2="220" stroke="#963f30" stroke-width="6" marker-end="url(#a)"/><text x="430" y="365" font-family="Inter" font-size="20" fill="#243947">Collapse: 2 Mar 1973, about 2:30 pm</text><text x="110" y="402" font-family="Inter" font-size="17" fill="#6d7b82">Pour dates from NBS Figure 2.2; ages are calendar-day ranges at collapse.</text></svg>