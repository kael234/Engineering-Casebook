<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ issue_id }} - {{ title }}</title>
  <style>{{ css }}</style>
  <style>
    .page-3 .page-columns > h1:first-of-type,
    .page-3 .page-columns > h2:first-of-type,
    .page-3 .page-columns > p:first-of-type,
    .page-3 .page-columns > .technical-figure:first-of-type {
      column-span: all;
    }
    .page-3 .page-columns > h2:first-of-type {
      font-size: 22pt;
      line-height: 0.98;
      margin-bottom: 2mm;
    }
    .page-3 .page-columns > p:first-of-type {
      font-size: 9.4pt;
      margin-bottom: 1.8mm;
    }
    .page-3 .page-columns > .technical-figure:first-of-type {
      margin: 1.2mm 0 2.5mm;
      padding: 1.5mm;
      border: 0.6pt solid #8bb4c7;
      background: #edf4f6;
    }
    .page-3 .page-columns > .technical-figure:first-of-type img {
      max-height: 92mm;
    }
  </style>
</head>
<body>
  {% for page in pages %}
  <section class="casebook-page page-{{ page.number }}">
    <header class="page-header">
      <span class="issue-mark">ENGINEERING CASEBOOK · {{ issue_number }}</span>
      <span class="page-role">{{ page.title }}</span>
    </header>
    {% if page.mode == 'deep_dive' %}
    <div class="deep-dive-header">{{ page.header_html | safe }}</div>
    <div class="deep-dive-grid">
      <div class="deep-dive-column deep-dive-left">{{ page.left_html | safe }}</div>
      <div class="deep-dive-column deep-dive-right">
        <div class="deep-dive-figures">{{ page.figures_html | safe }}</div>
        {{ page.right_html | safe }}
      </div>
    </div>
    {% else %}
    <div class="page-columns">{{ page.html | safe }}</div>
    {% endif %}
  </section>
  {% endfor %}
</body>
</html>
