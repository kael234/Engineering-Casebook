<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 450" role="img"><title>Oroville spillway under-slab uplift mechanism</title><desc>Schematic section showing chute slab, joint or crack water entry, under-slab pressure, drainage route and erodible foundation. No dimensions or pressure values are asserted.</desc><metadata>origin: Engineering Casebook diagnostic redraw; source_ids: [SRC-0025]</metadata><defs><marker id="u" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#2d6f8e"/></marker></defs><path d="M60 150 L760 210 L750 255 L55 195 Z" fill="#d9d4ca" stroke="#263746" stroke-width="4"/><path d="M60 195 L750 255 L730 390 L80 350 Z" fill="#c5aa82" stroke="#263746" stroke-width="3"/><path d="M390 178 L400 222" stroke="#8d3f32" stroke-width="6"/><path d="M398 120 C420 145 420 170 400 215" stroke="#2d6f8e" stroke-width="6" fill="none" marker-end="url(#u)"/><g stroke="#2d6f8e" stroke-width="5" marker-end="url(#u)"><line x1="270" y1="275" x2="270" y2="220"/><line x1="390" y1="290" x2="390" y2="235"/><line x1="520" y1="302" x2="520" y2="247"/></g><path d="M600 285 C650 300 690 320 735 335" stroke="#2d6f8e" stroke-width="5" fill="none" marker-end="url(#u)"/><g font-family="Arial,sans-serif" font-size="23" fill="#263746"><text x="85" y="120">chute slab</text><text x="420" y="130">water entry at crack / joint</text><text x="210" y="330">under-slab pressure</text><text x="585" y="365">drainage / escape path</text><text x="90" y="415">foundation rock: exposure allows erosion to progress</text></g></svg>