<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" role="img"><title>Mianus River Bridge pin-and-hanger deterioration mechanism</title><desc>Schematic connection showing a suspended span hanger on a pin, corrosion accumulation, lateral displacement direction and loss-of-support consequence. No dimensions are asserted.</desc><metadata>origin: Engineering Casebook diagnostic redraw; source_ids: [SRC-0026]</metadata><defs><marker id="m" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#8d3f32"/></marker></defs><rect x="70" y="80" width="300" height="70" fill="#d9d4ca" stroke="#263746" stroke-width="4"/><rect x="460" y="255" width="290" height="70" fill="#d9d4ca" stroke="#263746" stroke-width="4"/><path d="M325 125 L520 285" stroke="#7c858a" stroke-width="34"/><circle cx="325" cy="125" r="36" fill="#f2c879" stroke="#263746" stroke-width="5"/><circle cx="325" cy="125" r="18" fill="#263746"/><g fill="#8d6c45"><circle cx="296" cy="155" r="10"/><circle cx="311" cy="163" r="8"/><circle cx="282" cy="146" r="7"/></g><line x1="300" y1="190" x2="390" y2="190" stroke="#8d3f32" stroke-width="5" marker-end="url(#m)"/><g font-family="Arial,sans-serif" font-size="23" fill="#263746"><text x="80" y="55">fixed cantilever span</text><text x="500" y="355">suspended span</text><text x="205" y="225">corrosion-induced lateral force / hanger movement</text><text x="470" y="115">pin-and-hanger support detail</text><text x="85" y="405">System lesson: local loss of bearing can release the suspended span</text></g></svg>