<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img"><title>L'Ambiance Plaza probable support-loss sequence</title><desc>Three-stage schematic of normal support, excessive lifting-angle deformation, and loss of lifting-nut support as described by the investigation. No dimensions are asserted.</desc><metadata>origin: Engineering Casebook diagnostic redraw; source_ids: [SRC-0024]</metadata><defs><marker id="r" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#8d3f32"/></marker></defs><g font-family="Arial,sans-serif" fill="#263746"><text x="70" y="45" font-size="24">1. Supported lifting state</text><text x="350" y="45" font-size="24">2. Local angle deforms</text><text x="650" y="45" font-size="24">3. Nut loses support</text></g><g stroke="#263746" stroke-width="4" fill="none"><path d="M125 85 V315 M405 85 V315 M705 85 V315"/><path d="M70 210 H180 M350 210 H460 M650 210 H760"/></g><g fill="#f2c879" stroke="#263746" stroke-width="3"><rect x="92" y="155" width="66" height="40"/><path d="M372 155 L438 155 L425 198 L365 190 Z"/><path d="M672 165 L738 165 L725 210 L665 196 Z"/></g><g fill="#8d3f32"><circle cx="125" cy="225" r="14"/><circle cx="405" cy="225" r="14"/><circle cx="725" cy="235" r="14"/></g><line x1="705" y1="240" x2="705" y2="300" stroke="#8d3f32" stroke-width="5" marker-end="url(#r)"/><text x="55" y="365" font-family="Arial,sans-serif" font-size="21" fill="#263746">schematic only</text><text x="325" y="365" font-family="Arial,sans-serif" font-size="21" fill="#263746">investigation reproduced excessive deformation</text><text x="630" y="365" font-family="Arial,sans-serif" font-size="21" fill="#263746">probable initiating loss of support</text></svg>