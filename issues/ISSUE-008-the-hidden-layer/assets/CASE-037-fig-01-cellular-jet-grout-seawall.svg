<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" role="img" aria-labelledby="title desc">
<title id="title">Cellular jet-grout ground improvement behind a seawall</title>
<desc id="desc">Conceptual section showing a seawall face supported by a cellular block of jet-grouted soil extending through loose liquefiable fill toward firmer glacial soil. Based on SRC-0050, SRC-0051 and SRC-0052.</desc>
<rect width="900" height="440" fill="#ffffff"/>
<rect x="0" y="285" width="900" height="155" fill="#d1d5db"/>
<rect x="0" y="205" width="900" height="80" fill="#f3f4f6"/>
<rect x="690" y="90" width="55" height="240" fill="#9ca3af" stroke="#1f2937" stroke-width="4"/>
<rect x="745" y="90" width="155" height="195" fill="#bfdbfe"/>
<text x="820" y="125" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#2563eb">water</text>
<g fill="none" stroke="#d97706" stroke-width="18" opacity="0.8">
<ellipse cx="250" cy="245" rx="55" ry="92"/><ellipse cx="360" cy="245" rx="55" ry="92"/><ellipse cx="470" cy="245" rx="55" ry="92"/><ellipse cx="580" cy="245" rx="55" ry="92"/>
</g>
<text x="415" y="105" font-family="Arial, sans-serif" font-size="23" text-anchor="middle" fill="#1f2937">cellular jet-grout block</text>
<text x="415" y="178" font-family="Arial, sans-serif" font-size="20" text-anchor="middle" fill="#374151">improved columns enclose otherwise liquefiable soil</text>
<text x="415" y="255" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#1f2937">loose waterfront fill</text>
<text x="415" y="370" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#1f2937">firmer glacial soils</text>
<text x="716" y="65" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#1f2937">seawall face</text>
<path d="M655 245 H690" stroke="#1f2937" stroke-width="4"/>
</svg>
