<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img" aria-labelledby="title desc">
<title id="title">Inspection-to-action control loop</title>
<desc id="desc">Editorial diagram showing the steps from observing deterioration to classifying structural consequence, assigning action, completing work and verifying closure. Fern Hollow evidence is from SRC-0042 and SRC-0043.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1f2937"/></marker></defs>
<rect width="900" height="390" fill="#ffffff"/>
<g font-family="Arial, sans-serif" font-size="19" text-anchor="middle" fill="#1f2937">
<rect x="40" y="145" width="145" height="80" rx="10" fill="#e5e7eb" stroke="#1f2937" stroke-width="3"/><text x="112" y="177">Observe</text><text x="112" y="202">and measure</text>
<rect x="220" y="145" width="145" height="80" rx="10" fill="#e5e7eb" stroke="#1f2937" stroke-width="3"/><text x="292" y="177">Classify</text><text x="292" y="202">consequence</text>
<rect x="400" y="145" width="145" height="80" rx="10" fill="#e5e7eb" stroke="#1f2937" stroke-width="3"/><text x="472" y="177">Assign</text><text x="472" y="202">action + priority</text>
<rect x="580" y="145" width="145" height="80" rx="10" fill="#e5e7eb" stroke="#1f2937" stroke-width="3"/><text x="652" y="177">Complete</text><text x="652" y="202">the control</text>
<rect x="760" y="145" width="110" height="80" rx="10" fill="#e5e7eb" stroke="#1f2937" stroke-width="3"/><text x="815" y="177">Verify</text><text x="815" y="202">closure</text>
</g>
<g stroke="#1f2937" stroke-width="3" marker-end="url(#a)"><path d="M185 185 H215"/><path d="M365 185 H395"/><path d="M545 185 H575"/><path d="M725 185 H755"/></g>
<path d="M815 230 C815 330 112 330 112 230" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/>
<text x="450" y="350" font-family="Arial, sans-serif" font-size="21" text-anchor="middle" fill="#2563eb">new evidence returns to the next inspection cycle</text>
<path d="M472 130 V78" stroke="#dc2626" stroke-width="4"/>
<text x="472" y="55" font-family="Arial, sans-serif" font-size="22" text-anchor="middle" fill="#dc2626">a report alone does not close the loop</text>
</svg>
