<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img"><title>de la Concorde vulnerability and deterioration sequence</title><desc>Conceptual sequence based on SRC-0036 and SRC-0037 showing how detailing, as-built condition, water exposure, deterioration and repair can interact with a brittle shear load path.</desc><rect width="1000" height="430" fill="#f7f3ea"/><g font-family="Arial,sans-serif" fill="#172433" text-anchor="middle"><text x="500" y="55" font-size="29" font-weight="700">A brittle path can lose margin in several stages</text></g><g stroke="#172433" stroke-width="3"><rect x="45" y="120" width="165" height="150" rx="12" fill="#e7dfcf"/><rect x="235" y="120" width="165" height="150" rx="12" fill="#e7dfcf"/><rect x="425" y="120" width="165" height="150" rx="12" fill="#e7dfcf"/><rect x="615" y="120" width="165" height="150" rx="12" fill="#e7dfcf"/><rect x="805" y="120" width="150" height="150" rx="12" fill="#d8b36a"/></g><g font-family="Arial,sans-serif" fill="#172433" text-anchor="middle" font-size="19"><text x="127" y="158"><tspan x="127">Design / detailing</tspan><tspan x="127" dy="28">vulnerability</tspan></text><text x="317" y="158"><tspan x="317">As-built</tspan><tspan x="317" dy="28">reinforcement +</tspan><tspan x="317" dy="28">concrete quality</tspan></text><text x="507" y="158"><tspan x="507">Water exposure</tspan><tspan x="507" dy="28">and service</tspan><tspan x="507" dy="28">deterioration</tspan></text><text x="697" y="158"><tspan x="697">Repair work</tspan><tspan x="697" dy="28">changes the</tspan><tspan x="697" dy="28">critical zone</tspan></text><text x="880" y="158" font-weight="700"><tspan x="880">Reduced</tspan><tspan x="880" dy="28">brittle shear</tspan><tspan x="880" dy="28">margin</tspan></text><text x="500" y="340" font-size="20">Interacting contributors; not a claim that any one stage alone causes collapse.</text></g><!-- Origin: Engineering Casebook redraw. Sources: SRC-0036, SRC-0037 --></svg>