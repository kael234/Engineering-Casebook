<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img"><title>Ching Cheung Road progressive groundwater and drainage mechanism</title><desc>Conceptual slope section derived from GEO Report No. 78, SRC-0038, showing rainfall infiltration, disrupted surface drainage, transient perched groundwater, natural subsurface pipes and raking drains.</desc><rect width="1000" height="520" fill="#f7f3ea"/><path d="M70 405C220 365 315 260 420 180C560 75 760 210 930 285V465H70Z" fill="#d8c7a4" stroke="#172433" stroke-width="4"/><path d="M360 315C500 245 655 250 815 330" fill="none" stroke="#2d6f8a" stroke-width="8" stroke-dasharray="14 10"/><path d="M410 185L485 230L450 260" fill="none" stroke="#9b3f32" stroke-width="6"/><g stroke="#2d6f8a" stroke-width="5"><path d="M450 100L420 165"/><path d="M535 105L505 190"/><path d="M625 115L590 210"/><path d="M735 150L700 235"/></g><g stroke="#285a6a" stroke-width="5" fill="none"><path d="M325 360C430 330 525 310 620 285"/><path d="M300 390C410 372 520 350 650 318"/></g><g font-family="Arial,sans-serif" fill="#172433"><text x="65" y="55" font-size="28" font-weight="700">MOVEMENT CAN CHANGE THE WATER MODEL</text><text x="365" y="340" font-size="21">transient perched groundwater</text><text x="245" y="418" font-size="20">natural subsurface pathways / old disturbed ground</text><text x="650" y="120" font-size="20">intense rainfall + infiltration</text><text x="392" y="162" font-size="20" fill="#9b3f32">surface drainage disrupted by movement</text><text x="655" y="390" font-size="20">existing raking drains may not control peak pressure</text><text x="70" y="490" font-size="18">Conceptual, not to scale. Geological labels follow GEO Report No. 78.</text></g><!-- Origin: Engineering Casebook redraw. Source: SRC-0038 --></svg>