<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img"><title>Fort Lauderdale runway beam temporary pipe-support and sliding-bearing interface</title><desc>Conceptual transverse section based on OSHA SRC-0039 showing a 12 inch water main supported between sloping beam flanges, horizontal thrust and low-friction sliding bearings without incident-stage restraint.</desc><rect width="1000" height="520" fill="#f7f3ea"/><g fill="#d9d2c3" stroke="#172433" stroke-width="4"><path d="M170 120H390L350 360H210Z"/><path d="M610 120H830L790 360H650Z"/></g><g fill="#d8b36a" stroke="#172433" stroke-width="4"><rect x="215" y="360" width="130" height="28"/><rect x="655" y="360" width="130" height="28"/></g><g stroke="#172433" stroke-width="5" fill="none"><path d="M330 300L455 340"/><path d="M670 300L545 340"/></g><circle cx="500" cy="330" r="55" fill="#315d6c" stroke="#172433" stroke-width="5"/><g stroke="#9b3f32" stroke-width="7"><line x1="445" y1="330" x2="355" y2="330"/><line x1="555" y1="330" x2="645" y2="330"/></g><g font-family="Arial,sans-serif" fill="#172433"><text x="60" y="55" font-size="28" font-weight="700">TEMPORARY PIPE LOAD + DESIGNED SLIDING INTERFACE</text><text x="446" y="337" font-size="18" fill="#ffffff">12 in pipe</text><text x="390" y="280" font-size="19">steel-channel supports</text><text x="360" y="315" font-size="19" fill="#9b3f32">lateral thrust</text><text x="155" y="435" font-size="19">PTFE / stainless sliding bearing</text><text x="610" y="435" font-size="19">incident-stage restraint absent</text><text x="80" y="485" font-size="18">Conceptual section. Beam dimensions and force magnitude are not to scale.</text></g><!-- Origin: Engineering Casebook redraw. Source: SRC-0039 --></svg>