<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" role="img"><title>Skyline Plaza Case 1 unshored load path</title><desc>NBS Case 1 schematic: the unshored 23rd floor slab supports its own weight, the 23rd floor formwork, and the newly poured portion of the 24th floor. The report used an estimated 23rd-floor concrete strength of 1200 psi.</desc><metadata>origin: Engineering Casebook redraw; source_ids: [SRC-0029]</metadata><defs><marker id="d" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#963f30"/></marker></defs><rect width="820" height="460" fill="#eaf2f5"/><rect x="115" y="95" width="590" height="45" fill="#d8d2c6" stroke="#19384a" stroke-width="4"/><rect x="205" y="205" width="500" height="45" fill="#d8d2c6" stroke="#19384a" stroke-width="4"/><rect x="250" y="160" width="410" height="28" fill="#f2c66f" stroke="#19384a" stroke-width="3"/><g stroke="#963f30" stroke-width="5" marker-end="url(#d)"><line x1="300" y1="145" x2="300" y2="200"/><line x1="455" y1="145" x2="455" y2="200"/><line x1="610" y1="145" x2="610" y2="200"/></g><g fill="#19384a"><rect x="265" y="250" width="45" height="150"/><rect x="600" y="250" width="45" height="150"/></g><path d="M270 250 C300 300 325 305 345 250" fill="none" stroke="#963f30" stroke-width="5"/><path d="M605 250 C575 300 550 305 530 250" fill="none" stroke="#963f30" stroke-width="5"/><g font-family="Inter" fill="#243947"><text x="125" y="82" font-size="22">newly poured 24th-floor slab portion: 80 psf</text><text x="260" y="180" font-size="19">23rd-floor formwork: 5 psf</text><text x="215" y="280" font-size="22">23rd-floor slab: 80 psf self-weight</text><text x="215" y="322" font-size="22">Case 1 load under the poured area: 165 psf</text><text x="215" y="352" font-size="22" fill="#963f30">estimated 23rd-floor concrete strength used: 1200 psi</text><text x="215" y="422" font-size="18">NBS concluded likely initiation was shear around one or more columns.</text></g></svg>